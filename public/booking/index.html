<body data-hub-page="booking">
  <div id="payment-notice" role="status" style="display:none;padding:18px;text-align:center;background:#0B0F1A;color:#00FFC6"></div><div id="root"></div>
<script>
const paymentState = new URLSearchParams(location.search).get('payment');
const notice = document.getElementById('payment-notice');
const tokenKey = 'ochilink-booking-token';
if (paymentState === 'returned') {
    sessionStorage.removeItem(tokenKey);
    notice.style.display = 'block';
    notice.textContent = 'You returned from Stripe. Payment verification may still be processing. A confirmation email follows once payment is verified.';
} else if (sessionStorage.getItem(tokenKey)) {
    notice.style.display = 'block';
    notice.textContent = 'You have an unfinished checkout. Your time stays held until checkout expires. ';
    const resume = document.createElement('button');
    resume.textContent = 'Resume payment';
    resume.style.cssText = 'margin-left:16px;padding:10px;cursor:pointer';
    resume.onclick = async () => {
        resume.disabled = true;
        try {
            const response = await fetch('/api/hub?resource=checkout', {
                method: 'POST', signal: AbortSignal.timeout(25000),
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionStorage.getItem(tokenKey) })
            });
            const data = await response.json();
            if (!response.ok) {
                if ([404, 409].includes(response.status)) {
                    sessionStorage.removeItem(tokenKey);
                    notice.textContent = data.error + ' Reload this page to choose another time.';
                    return;
                }
                throw new Error(data.error);
            }
            const url = new URL(data.url);
            if (url.protocol !== 'https:' || url.hostname !== 'checkout.stripe.com') throw new Error('Invalid checkout URL');
            location.assign(url.href);
        } catch (error) {
            notice.firstChild.textContent = error.message + ' ';
            resume.disabled = false;
        }
    };
    notice.appendChild(resume);
}
</script>
