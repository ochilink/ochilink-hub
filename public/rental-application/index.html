  <script>
  (async()=>{
    try{
      const params=new URLSearchParams(location.search);
      if(params.get('payment')==='returned' || params.get('payment')==='cancelled'){
        const r=await fetch('/api/hub?resource=canonical-origin',{cache:'no-store'});
        if(r.ok){
          const {origin}=await r.json();
          if(origin && origin!==location.origin){
            location.replace(origin+location.pathname+location.search+location.hash);
            return;
          }
        }
      }
    }catch{}
  })();
  </script>
